[workspace]
resolver = "2"
members = [
    "crates/aaatw-core",
    "crates/aaatw-assets",
    "crates/aaatw-platform",
    "crates/aaatw-sdl2",
    "crates/aaatw-extract",
    "crates/aaatw-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
authors = ["Thomas Hodgkinson <thomashodgkinson1987@gmail.com>"]
repository = "https://github.com/thomashodgkinson1987/aaatw-rs"

[workspace.dependencies]
aaatw-core = { path = "crates/aaatw-core" }
aaatw-assets = { path = "crates/aaatw-assets" }
aaatw-platform = { path = "crates/aaatw-platform" }
aaatw-sdl2 = { path = "crates/aaatw-sdl2" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
roxmltree = "0.21"
sdl2 = { version = "0.39", features = ["bundled", "static-link"] }
thiserror = "2"